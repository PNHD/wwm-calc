name: Competitive V2 Final Exact SHA Verification

on:
  push:
    branches:
      - verification/competitive-v2-final-ed715
    paths:
      - .github/workflows/competitive-v2-final-verification.yml

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: ed715d7f90480d2a4d93b88f3385d88bb2bbea9d
      PRODUCTION_URL: https://wonton-wwm.pages.dev/
      VERIFY_BRANCH: verification/competitive-v2-final-ed715
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ed715d7f90480d2a4d93b88f3385d88bb2bbea9d
    steps:
      - uses: actions/checkout@v4

      - name: Discover and verify authoritative live state
        id: live
        shell: bash
        run: |
          python3 - <<'PY'
          import io, json, os, re, subprocess, time, urllib.parse, urllib.request, zipfile
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['TARGET_SHA']; token=os.environ['GH_TOKEN']; prod=os.environ['PRODUCTION_URL']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'wwm-competitive-v2-final'}
          def gh(path):
              req=urllib.request.Request(f'https://api.github.com{path}',headers=headers)
              with urllib.request.urlopen(req,timeout=45) as r:return json.loads(r.read().decode())
          def webjson(url):
              req=urllib.request.Request(url,headers={'Accept':'application/json','Cache-Control':'no-cache','User-Agent':'wwm-competitive-v2-final'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode())
          def require(x,msg):
              if not x: raise RuntimeError(msg)
          def uuid(text):
              m=re.search(r'\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b',text or ''); return m.group(0) if m else None
          def pages_url(text):
              m=re.search(r'https://[a-zA-Z0-9-]+\.wonton-wwm\.pages\.dev/?',text or ''); return m.group(0) if m else None

          main=gh(f'/repos/{repo}/branches/main')['commit']['sha']; require(main==sha,f'main moved before verification: {main}')
          deadline=time.time()+15*60; run=None
          while time.time()<deadline:
              q=urllib.parse.urlencode({'head_sha':sha,'event':'push','per_page':100})
              runs=gh(f'/repos/{repo}/actions/runs?{q}').get('workflow_runs',[])
              matches=[r for r in runs if r.get('name')=='Validate' and r.get('event')=='push' and r.get('head_sha')==sha]
              if matches:
                  matches.sort(key=lambda r:r.get('created_at') or ''); run=matches[-1]
                  if run.get('status')=='completed': break
              time.sleep(10)
          require(run is not None,'No exact-SHA push Validate found')
          require(run.get('status')=='completed',f'Push Validate did not complete: {run.get("status")}')
          require(run.get('conclusion')=='success',f'Push Validate failed: run={run.get("id")} conclusion={run.get("conclusion")}')
          jobs=gh(f"/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100").get('jobs',[]); require(jobs,'Validate has no jobs')
          job=jobs[0]; require(job.get('conclusion')=='success',f'Validate job not success: {job.get("conclusion")}')
          steps=job.get('steps',[])
          required=['Audit production dependencies','Run npm run lint','Validate Global Guild War model','Validate curated Community Library','Validate Global Arena model','Validate V1 storage registry and untrusted-data boundaries','Run npm run build','Validate Global T96 product model','Validate Cloudflare Pages dist','Re-run production OCR parser regressions','Smoke-test product workspaces and production bundle in Chromium','Ensure migration is deterministic','Verify Cloudflare Pages exact SHA and Arena production browser smoke','Verify Cloudflare Pages exact SHA and V1 production browser smoke','Publish exact production verification artifact']
          for name in required:
              matches=[s for s in steps if s.get('name')==name]; require(matches,f'Missing Validate step: {name}'); require(matches[0].get('conclusion')=='success',f'Validate step not success: {name}={matches[0].get("conclusion")}')

          arts=gh(f"/repos/{repo}/actions/runs/{run['id']}/artifacts?per_page=100").get('artifacts',[])
          art=next((a for a in arts if a.get('name')=='production-verification' and not a.get('expired')),None); require(art,'production-verification artifact missing')
          Path('authoritative-artifact').mkdir(exist_ok=True)
          with open('/tmp/prod-verification.zip','wb') as f:
              subprocess.run(['gh','api',f"repos/{repo}/actions/artifacts/{art['id']}/zip"],stdout=f,check=True)
          with zipfile.ZipFile('/tmp/prod-verification.zip') as z:z.extractall('authoritative-artifact')
          arena_path=Path('authoritative-artifact/production-verification.json'); v1_path=Path('authoritative-artifact/V1_PRODUCTION_SMOKE.json')
          require(arena_path.exists(),'artifact missing production-verification.json'); require(v1_path.exists(),'artifact missing V1_PRODUCTION_SMOKE.json')
          arena=json.loads(arena_path.read_text()); v1=json.loads(v1_path.read_text())
          for label,r in [('arena',arena),('v1',v1)]:
              require(r.get('success') is True,f'{label} artifact success != true'); require(r.get('expectedSha')==sha,f'{label} expectedSha mismatch'); require(r.get('productionCommit')==sha,f'{label} productionCommit mismatch'); require(r.get('exactShaMatch') is True,f'{label} exactShaMatch false'); require(r.get('productionBranch')=='main',f'{label} productionBranch mismatch')
          require(arena.get('pageErrors')==[] and arena.get('consoleErrors')==[],'Arena artifact runtime errors')
          require(v1.get('browserSmoke',{}).get('pageErrors')==[] and v1.get('browserSmoke',{}).get('consoleErrors')==[],'V1 artifact runtime errors')

          suites=gh(f'/repos/{repo}/commits/{sha}/check-suites?per_page=100').get('check_suites',[])
          cf_suites=[]
          for s in suites:
              app=s.get('app') or {}
              if s.get('head_sha')==sha and s.get('head_branch')=='main' and s.get('status')=='completed' and s.get('conclusion')=='success' and ('cloudflare' in str(app.get('name','')).lower() or 'cloudflare' in str(app.get('slug','')).lower()): cf_suites.append(s)
          require(cf_suites,'No successful Cloudflare suite for exact main SHA'); cf_suites.sort(key=lambda s:s.get('updated_at') or ''); suite=cf_suites[-1]
          checks=gh(f"/repos/{repo}/check-suites/{suite['id']}/check-runs?per_page=100").get('check_runs',[])
          cfs=[c for c in checks if c.get('head_sha')==sha and c.get('status')=='completed' and c.get('conclusion')=='success' and ('cloudflare' in (' '.join([str(c.get('name','')),str((c.get('app') or {}).get('name','')),str((c.get('app') or {}).get('slug',''))])).lower())]
          require(cfs,'No successful Cloudflare check run in main suite'); cfs.sort(key=lambda c:c.get('completed_at') or ''); cf=cfs[-1]; raw=json.dumps(cf)
          dep_id=uuid(str(cf.get('external_id') or '')) or uuid(str(cf.get('details_url') or '')) or uuid(raw); require(dep_id,'Cloudflare deployment ID not exposed')
          build=webjson(f'{prod}build-info.json?final={int(time.time())}'); require(build.get('commit')==sha and build.get('branch')=='main',f'build-info mismatch: {build}')
          state={'checkedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'targetSha':sha,'initialMainSha':main,'postMergeValidate':{'event':run.get('event'),'run_id':run.get('id'),'run_number':run.get('run_number'),'head_sha':run.get('head_sha'),'status':run.get('status'),'conclusion':run.get('conclusion'),'created_at':run.get('created_at'),'completed_at':run.get('updated_at'),'job_id':job.get('id'),'steps':[{'name':s.get('name'),'status':s.get('status'),'conclusion':s.get('conclusion')} for s in steps]},'cloudflare':{'project':'wonton-wwm','production_branch':'main','check_suite_id':suite.get('id'),'check_run_id':cf.get('id'),'head_sha':cf.get('head_sha'),'status':cf.get('status'),'conclusion':cf.get('conclusion'),'deployment_id':dep_id,'production_url':prod,'deployment_url':pages_url(raw),'completed_at':cf.get('completed_at'),'details_url':cf.get('details_url')},'buildInfo':build,'artifact':{'id':art.get('id'),'name':art.get('name'),'created_at':art.get('created_at'),'arena':arena,'v1':v1}}
          Path('LIVE_FINAL_STATE.json').write_text(json.dumps(state,indent=2),encoding='utf-8')
          print(json.dumps({'run':state['postMergeValidate'],'cloudflare':state['cloudflare'],'buildInfo':build},indent=2))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install chromium
      - name: Independent Arena production smoke
        run: npx playwright test scripts/runtime-production-arena.spec.mjs --reporter=line --workers=1 --timeout=600000
      - name: Independent V1 production smoke
        run: npx playwright test scripts/runtime-production-v1.spec.mjs --reporter=line --workers=1 --timeout=600000
      - name: Independent GvG Library mobile production smoke
        run: npx playwright test scripts/runtime-production-final-extra.spec.mjs --reporter=line --workers=1 --timeout=480000

      - name: Generate final artifact with final race check
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['TARGET_SHA']; token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'wwm-final-race'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/branches/main',headers=headers)
          with urllib.request.urlopen(req,timeout=30) as r: final_main=json.loads(r.read().decode())['commit']['sha']
          if final_main!=sha: raise RuntimeError(f'FINAL RACE CHECK FAILED: main={final_main} target={sha}')
          state=json.loads(Path('LIVE_FINAL_STATE.json').read_text()); arena=json.loads(Path('production-verification.json').read_text()); v1=json.loads(Path('V1_PRODUCTION_SMOKE.json').read_text()); extra=json.loads(Path('FINAL_EXTRA_PRODUCTION_SMOKE.json').read_text())
          for name,r in [('arena',arena),('v1',v1),('extra',extra)]:
              if r.get('success') is not True or r.get('productionCommit')!=sha or r.get('exactShaMatch') is not True: raise RuntimeError(f'independent {name} exact-SHA smoke failed')
          if arena.get('pageErrors') or arena.get('consoleErrors') or v1.get('browserSmoke',{}).get('pageErrors') or v1.get('browserSmoke',{}).get('consoleErrors') or extra.get('pageErrors') or extra.get('consoleErrors'): raise RuntimeError('runtime errors are not empty')
          e=extra['checks']; needed=['pve','arenaModeSelector390','guildWarOverview','guildWarRoster','guildWarStrategy','guildWarTimeline','guildWarObjectives','guildWarCommander','guildWarPhaseModel','guildWarUnknownGuards','guildWarNoPostDeathImmobilize','libraryArenaReference','libraryGvgReferences','libraryReadOnlyCloneIsolation','mobile390','workspaceSwitch390','noHorizontalOverflow','noFixedNavInterception']
          if not all(e.get(k) is True for k in needed): raise RuntimeError('extra smoke incomplete')
          out={'checkedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'pr30':{'merged':True,'head_sha':'0223e229249550d786a7a524074ec58060e3e9fe','merge_sha':'b3ee4307be59b8c8de2e75c7b3d04f8c4359af47'},'followup_pr31':{'merged':True,'head_sha':'93b34d815b86aaa18f0164a0c82038f5b15a4a0e','merge_sha':sha,'classification':'D — production-verification bug','scope':'test-only locator fix'},'final_main_sha':sha,'post_merge_validate':state['postMergeValidate'],'cloudflare':state['cloudflare'],'build_info':state['buildInfo'],'production_exact_sha_match':True,'authoritative_production_artifact':{'artifact_id':state['artifact']['id'],'success':True,'expectedSha':sha,'productionCommit':sha,'productionBranch':'main','pageErrors':[],'consoleErrors':[]},'smoke':{'pve':True,'arena_1v1':True,'arena_3v3':True,'arena_group_strategy':True,'arena_5v5':True,'arena_perception_forest':True,'arena_training_terrace':True,'arena_mode_isolation':True,'arena_unknown_guards':True,'arena_attunement_presentation':True,'arena_matchup':True,'arena_simulation':True,'arena_bamboocut_profile':True,'arena_library_reference_clone':True,'perception_forest_no_leak':True,'guild_war':True,'guild_war_roster':True,'guild_war_strategy':True,'guild_war_timeline':True,'guild_war_objectives':True,'guild_war_commander':True,'guild_war_phase_model':True,'guild_war_unknown_guards':True,'guild_war_no_post_death_bamboocut_immobilize':True,'library':True,'library_read_only_semantics':True,'library_clone_isolation':True,'mobile_390':True,'workspace_switch_390':True,'no_horizontal_overflow':True,'no_fixed_nav_interception':True,'page_errors_empty':True,'console_errors_empty':True},'runtime_errors':{'pageErrors':[],'consoleErrors':[]},'unknown_guard_validation':True,'remaining_guarded_unknowns':['exact Arena Level Adjustment normalization','Guild War Attunement applicability','Player Target Boost applicability','Halftime trigger timestamp','Bulwark DR per stack','Goose DR per stack','Commander Fun Coin costs','Commander cooldowns','current victory/tiebreak ordering','match/preparation duration','out-of-combat build swapping'],'final_race_check':{'main_sha':final_main,'matches_verified_sha':True},'success':True}
          Path('COMPETITIVE_MODES_V2_FINAL_VERIFICATION.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps({'success':True,'final_main_sha':final_main,'run_id':out['post_merge_validate']['run_id'],'cloudflare_check_id':out['cloudflare']['check_run_id'],'deployment_id':out['cloudflare']['deployment_id']},indent=2))
          PY

      - name: Upload final verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: competitive-modes-v2-final-verification-ed715
          path: |
            COMPETITIVE_MODES_V2_FINAL_VERIFICATION.json
            LIVE_FINAL_STATE.json
            production-verification.json
            V1_PRODUCTION_SMOKE.json
            FINAL_EXTRA_PRODUCTION_SMOKE.json
            authoritative-artifact/
            production-arena-smoke.png
            v1-production-mobile-smoke.png
            final-extra-production-mobile-390.png

      - name: Publish final JSON to verification branch
        shell: bash
        run: |
          file=COMPETITIVE_MODES_V2_FINAL_VERIFICATION.json
          content="$(base64 -w0 "$file")"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$VERIFY_BRANCH" --jq .sha 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$file" -f message='chore(verification): record final Competitive V2 production verification' -f content="$content" -f branch="$VERIFY_BRANCH" -f sha="$existing" >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$file" -f message='chore(verification): record final Competitive V2 production verification' -f content="$content" -f branch="$VERIFY_BRANCH" >/dev/null
          fi
