name: Diagnose Competitive V2 Verification

on:
  push:
    branches:
      - verification/competitive-v2-final-20260818
    paths:
      - .github/workflows/diagnose-competitive-v2-verification.yml

permissions:
  contents: write
  actions: read
  checks: read
  pull-requests: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: b3ee4307be59b8c8de2e75c7b3d04f8c4359af47
      VERIFY_BRANCH: verification/competitive-v2-final-20260818
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact post-merge push Validate
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['TARGET_SHA']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'wwm-competitive-v2-diagnostic',
          }
          def get_json(path):
              req = urllib.request.Request(f'https://api.github.com{path}', headers=headers)
              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.loads(r.read().decode())
          def get_bytes(path):
              req = urllib.request.Request(f'https://api.github.com{path}', headers=headers)
              with urllib.request.urlopen(req, timeout=90) as r:
                  return r.read()

          query = urllib.parse.urlencode({'head_sha': sha, 'event': 'push', 'per_page': 100})
          runs = get_json(f'/repos/{repo}/actions/runs?{query}').get('workflow_runs', [])
          matches = [r for r in runs if r.get('name') == 'Validate' and r.get('event') == 'push' and r.get('head_sha') == sha]
          matches.sort(key=lambda r: r.get('created_at') or '')
          if not matches:
              raise SystemExit('No exact push Validate found')
          run = matches[-1]
          jobs = get_json(f"/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100").get('jobs', [])
          job_rows = []
          for job in jobs:
              steps = job.get('steps', [])
              failed = [s for s in steps if s.get('conclusion') not in ('success', 'skipped')]
              log_text = ''
              try:
                  raw = get_bytes(f"/repos/{repo}/actions/jobs/{job['id']}/logs")
                  log_text = raw.decode('utf-8', errors='replace')
              except Exception as exc:
                  log_text = f'LOG_FETCH_ERROR: {exc}'
              # Keep the tail and error-centered excerpts without bloating the repository.
              lines = log_text.splitlines()
              error_indexes = [i for i, line in enumerate(lines) if re.search(r'(?i)(error|failed|failure|timeout|expect\(|traceback)', line)]
              excerpts = []
              for idx in error_indexes[-20:]:
                  start, end = max(0, idx - 4), min(len(lines), idx + 8)
                  excerpts.append('\n'.join(lines[start:end]))
              job_rows.append({
                  'id': job.get('id'), 'name': job.get('name'), 'status': job.get('status'),
                  'conclusion': job.get('conclusion'), 'started_at': job.get('started_at'),
                  'completed_at': job.get('completed_at'),
                  'failedSteps': failed,
                  'steps': steps,
                  'logErrorExcerpts': excerpts[-12:],
                  'logTail': '\n'.join(lines[-350:]),
              })

          report = {
              'targetSha': sha,
              'run': {
                  'id': run.get('id'), 'run_number': run.get('run_number'), 'name': run.get('name'),
                  'event': run.get('event'), 'head_sha': run.get('head_sha'), 'head_branch': run.get('head_branch'),
                  'status': run.get('status'), 'conclusion': run.get('conclusion'),
                  'created_at': run.get('created_at'), 'updated_at': run.get('updated_at'),
                  'run_attempt': run.get('run_attempt'), 'html_url': run.get('html_url'),
              },
              'jobs': job_rows,
          }
          Path('COMPETITIVE_MODES_V2_PUSH_VALIDATE_DIAGNOSTIC.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report['run'], indent=2))
          for job in job_rows:
              print(job['id'], job['name'], job['conclusion'], [s.get('name') for s in job['failedSteps']])
          PY

      - name: Publish diagnostic
        if: always()
        shell: bash
        run: |
          file=COMPETITIVE_MODES_V2_PUSH_VALIDATE_DIAGNOSTIC.json
          if [ ! -f "$file" ]; then
            printf '{"success":false,"error":"diagnostic file was not generated"}\n' > "$file"
          fi
          content="$(base64 -w0 "$file")"
          existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$VERIFY_BRANCH" --jq .sha 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$file" -f message='chore(verification): update push Validate diagnostic' -f content="$content" -f branch="$VERIFY_BRANCH" -f sha="$existing_sha" >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$file" -f message='chore(verification): record push Validate diagnostic' -f content="$content" -f branch="$VERIFY_BRANCH" >/dev/null
          fi
