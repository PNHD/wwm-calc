name: Diagnose Competitive V2 Verification

on:
  push:
    branches:
      - verification/competitive-v2-final-20260818
    paths:
      - .github/workflows/diagnose-competitive-v2-verification.yml

permissions:
  contents: write
  actions: read
  checks: read
  statuses: read
  deployments: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: b3ee4307be59b8c8de2e75c7b3d04f8c4359af47
      VERIFY_BRANCH: verification/competitive-v2-final-20260818
      PRODUCTION_URL: https://wonton-wwm.pages.dev/
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate all exact-SHA deployment evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['TARGET_SHA']; prod=os.environ['PRODUCTION_URL']; token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'wwm-final-deploy-enumerator'}
          def gh(path):
              req=urllib.request.Request(f'https://api.github.com{path}',headers=headers)
              with urllib.request.urlopen(req,timeout=45) as r:return json.loads(r.read().decode())
          def webjson(url):
              req=urllib.request.Request(url,headers={'Accept':'application/json','Cache-Control':'no-cache','User-Agent':'wwm-final-deploy-enumerator'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode())
          def uuid(text):
              m=re.search(r'\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b',text or ''); return m.group(0) if m else None
          def urls(text): return re.findall(r'https://[a-zA-Z0-9.-]*wonton-wwm\.pages\.dev/?',text or '')
          branch=gh(f'/repos/{repo}/branches/main'); main_sha=branch.get('commit',{}).get('sha')
          checks=gh(f'/repos/{repo}/commits/{sha}/check-runs?filter=all&per_page=100').get('check_runs',[])
          suites=gh(f'/repos/{repo}/commits/{sha}/check-suites?per_page=100').get('check_suites',[])
          deps=[]
          try: deps=gh(f'/repos/{repo}/deployments?sha={urllib.parse.quote(sha)}&per_page=100')
          except Exception as exc: deps=[{'fetchError':repr(exc)}]
          rows=[]
          for c in checks:
              app=c.get('app') or {}; out=c.get('output') or {}; raw=json.dumps(c,ensure_ascii=False)
              hay=' '.join(map(str,[c.get('name'),c.get('details_url'),c.get('external_id'),app.get('name'),app.get('slug'),out.get('title'),out.get('summary'),out.get('text')])).lower()
              if 'cloudflare' in hay or 'pages' in hay or 'wonton-wwm' in hay:
                  summary=str(out.get('summary') or '')
                  rows.append({'id':c.get('id'),'name':c.get('name'),'head_sha':c.get('head_sha'),'status':c.get('status'),'conclusion':c.get('conclusion'),'started_at':c.get('started_at'),'completed_at':c.get('completed_at'),'details_url':c.get('details_url'),'external_id':c.get('external_id'),'deployment_id':uuid(str(c.get('external_id') or '')) or uuid(str(c.get('details_url') or '')) or uuid(raw),'pages_urls':urls(raw),'app':{'id':app.get('id'),'name':app.get('name'),'slug':app.get('slug')},'output':{'title':out.get('title'),'summary':out.get('summary'),'text':out.get('text')},'looksPreview':('Branch Preview URL' in summary and 'verification-competitive-v2' in summary),'looksMainProduction':('Branch Preview URL' in summary and ('main.wonton-wwm.pages.dev' in summary or '>main<' in summary.lower()))})
          suite_rows=[]
          for s in suites:
              app=s.get('app') or {}; raw=json.dumps(s,ensure_ascii=False).lower()
              if 'cloudflare' in raw or 'pages' in raw:
                  suite_rows.append({'id':s.get('id'),'head_sha':s.get('head_sha'),'head_branch':s.get('head_branch'),'status':s.get('status'),'conclusion':s.get('conclusion'),'created_at':s.get('created_at'),'updated_at':s.get('updated_at'),'app':{'id':app.get('id'),'name':app.get('name'),'slug':app.get('slug')}})
          bi=None; bierr=None
          try: bi=webjson(f'{prod}build-info.json?verify={int(time.time())}')
          except Exception as exc: bierr=repr(exc)
          report={'checkedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'targetSha':sha,'mainSha':main_sha,'mainMatchesTarget':main_sha==sha,'cloudflareCheckRuns':rows,'cloudflareCheckSuites':suite_rows,'githubDeployments':deps,'buildInfo':bi,'buildInfoError':bierr,'buildInfoExactShaMatch':bool(bi and bi.get('commit')==sha and bi.get('branch')=='main')}
          Path('COMPETITIVE_MODES_V2_DEPLOYMENT_DIAGNOSTIC.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY
      - name: Publish deployment diagnostic
        if: always()
        shell: bash
        run: |
          file=COMPETITIVE_MODES_V2_DEPLOYMENT_DIAGNOSTIC.json
          [ -f "$file" ] || printf '{"success":false,"error":"deployment diagnostic not generated"}\n' > "$file"
          content="$(base64 -w0 "$file")"
          existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$VERIFY_BRANCH" --jq .sha 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$file" -f message='chore(verification): enumerate deployment evidence' -f content="$content" -f branch="$VERIFY_BRANCH" -f sha="$existing_sha" >/dev/null; else gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$file" -f message='chore(verification): enumerate deployment evidence' -f content="$content" -f branch="$VERIFY_BRANCH" >/dev/null; fi
