name: Diagnose Competitive V2 Verification

on:
  push:
    branches:
      - verification/competitive-v2-final-20260818
    paths:
      - .github/workflows/diagnose-competitive-v2-verification.yml

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      JOB_ID: '95635361425'
      VERIFY_BRANCH: verification/competitive-v2-final-20260818
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact failed step log
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; job=os.environ['JOB_ID']; token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'wwm-attempt2-error'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/jobs/{job}/logs',headers=headers)
          with urllib.request.urlopen(req,timeout=90) as r: text=r.read().decode('utf-8',errors='replace')
          lines=text.splitlines()
          patterns=re.compile(r'(?i)(strict mode violation|Arena mode|locator\(|resolved to|Error:|expect\(|runtime-production-arena|Smoke-test exact SHA and Arena)')
          hits=[i for i,line in enumerate(lines) if patterns.search(line)]
          excerpts=[]
          seen=set()
          for idx in hits:
              start=max(0,idx-7); end=min(len(lines),idx+16)
              key=(start,end)
              if key not in seen:
                  seen.add(key); excerpts.append('\n'.join(lines[start:end]))
          report={'jobId':int(job),'matchedLineCount':len(hits),'errorExcerpts':excerpts[-30:],'logTail':'\n'.join(lines[-500:])}
          Path('COMPETITIVE_MODES_V2_ATTEMPT2_ERROR.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps({'jobId':int(job),'matchedLineCount':len(hits)},indent=2))
          PY
      - name: Publish diagnostic
        if: always()
        shell: bash
        run: |
          file=COMPETITIVE_MODES_V2_ATTEMPT2_ERROR.json
          [ -f "$file" ] || printf '{"success":false,"error":"attempt2 error diagnostic not generated"}\n' > "$file"
          content="$(base64 -w0 "$file")"
          existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$VERIFY_BRANCH" --jq .sha 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$file" -f message='chore(verification): update attempt 2 error diagnostic' -f content="$content" -f branch="$VERIFY_BRANCH" -f sha="$existing_sha" >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$file" -f message='chore(verification): record attempt 2 error diagnostic' -f content="$content" -f branch="$VERIFY_BRANCH" >/dev/null
          fi
