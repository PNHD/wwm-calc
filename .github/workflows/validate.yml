name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify Cloudflare Pages Node baseline
        run: |
          node --version
          npm --version
      - run: npm ci
      - name: Apply deterministic release migrations before typecheck
        run: |
          node scripts/apply-arena-library.mjs
          node scripts/apply-arena-product-surface.mjs
          node scripts/apply-v1-release-hardening.mjs
          node scripts/apply-v1-release-ui.mjs
          node scripts/apply-v1-terminology.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Validate Global Guild War model
        run: node scripts/validate-gvg-model.mjs
      - name: Validate curated Community Library
        run: node scripts/validate-library.mjs
      - name: Validate Global Arena model
        run: node scripts/validate-arena-model.mjs
      - name: Validate V1 storage registry and untrusted-data boundaries
        run: npm run validate:v1-release
      - run: npm run build
      - name: Validate Global T96 product model
        run: npm run validate:t96-product
      - name: Validate Cloudflare Pages dist
        run: |
          npm run validate:pages-dist
          find dist -maxdepth 2 -type f | sort
      - name: Re-run production OCR parser regressions
        run: npm run validate:ocr-runtime
      - name: Install browser smoke-test runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install chromium
      - name: Smoke-test product workspaces and production bundle in Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/wwm-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          set +e
          npx playwright test scripts/runtime-t96-acceptance.spec.mjs --reporter=line --workers=1
          T96_STATUS=$?
          npx playwright test scripts/runtime-gvg-acceptance.spec.mjs --reporter=line --workers=1
          GVG_STATUS=$?
          npx playwright test scripts/runtime-workspace-ux.spec.mjs --reporter=line --workers=1 --timeout=120000
          UX_STATUS=$?
          npx playwright test scripts/runtime-library-acceptance.spec.mjs --reporter=line --workers=1 --timeout=120000
          LIBRARY_STATUS=$?
          npx playwright test scripts/runtime-arena-acceptance.spec.mjs --reporter=line --workers=1 --timeout=180000
          ARENA_STATUS=$?
          npx playwright test scripts/runtime-v1-release-acceptance.spec.mjs --reporter=line --workers=1 --timeout=180000
          V1_STATUS=$?
          set -e
          STATUS=$(( T96_STATUS != 0 || GVG_STATUS != 0 || UX_STATUS != 0 || LIBRARY_STATUS != 0 || ARENA_STATUS != 0 || V1_STATUS != 0 ))
          if [ "$T96_STATUS" -ne 0 ] && [ -f runtime-smoke-diagnostic.txt ]; then
            python3 - <<'PY'
          from pathlib import Path
          text=Path('runtime-smoke-diagnostic.txt').read_text()[:7000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::error file=scripts/runtime-t96-acceptance.spec.mjs,line=1,title=T96 runtime diagnostic::{text}')
          PY
          fi
          if [ "$T96_STATUS" -eq 0 ] && [ -f runtime-smoke-report.json ]; then
            python3 - <<'PY'
          from pathlib import Path
          text=Path('runtime-smoke-report.json').read_text()[:7000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::notice file=scripts/runtime-t96-acceptance.spec.mjs,line=1,title=T96 runtime acceptance::{text}')
          PY
          fi
          if [ "$GVG_STATUS" -ne 0 ]; then
            echo "::error file=scripts/runtime-gvg-acceptance.spec.mjs,line=1,title=Guild War runtime diagnostic::Guild War Chromium acceptance failed"
          elif [ -f runtime-gvg-smoke-report.json ]; then
            python3 - <<'PY'
          from pathlib import Path
          text=Path('runtime-gvg-smoke-report.json').read_text()[:7000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::notice file=scripts/runtime-gvg-acceptance.spec.mjs,line=1,title=Guild War runtime acceptance::{text}')
          PY
          fi
          if [ "$UX_STATUS" -ne 0 ]; then
            echo "::error file=scripts/runtime-workspace-ux.spec.mjs,line=1,title=Workspace UX diagnostic::Responsive workspace acceptance or visual QA failed"
          else
            echo "::notice file=scripts/runtime-workspace-ux.spec.mjs,line=1,title=Workspace UX acceptance::PvE/Guild War IA, state preservation, responsive layouts, keyboard focus and representative screenshots passed"
          fi
          if [ "$LIBRARY_STATUS" -ne 0 ]; then
            echo "::error file=scripts/runtime-library-acceptance.spec.mjs,line=1,title=Library runtime diagnostic::Library routing, clone isolation, build compare, sharing, security or responsive acceptance failed"
          else
            echo "::notice file=scripts/runtime-library-acceptance.spec.mjs,line=1,title=Library runtime acceptance::Curated Library, read-only detail/share, safe clone, PvE/Guild War comparison, favorites and responsive QA passed"
          fi
          if [ "$ARENA_STATUS" -ne 0 ]; then
            echo "::error file=scripts/runtime-arena-acceptance.spec.mjs,line=1,title=Arena runtime diagnostic::Arena workspace, matchup/state model, Arena Library/share, History or responsive visual QA failed"
          elif [ -f runtime-arena-smoke-report.json ]; then
            python3 - <<'PY'
          from pathlib import Path
          text=Path('runtime-arena-smoke-report.json').read_text()[:7000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::notice file=scripts/runtime-arena-acceptance.spec.mjs,line=1,title=Arena runtime acceptance::{text}')
          PY
          fi
          if [ "$V1_STATUS" -ne 0 ]; then
            echo "::error file=scripts/runtime-v1-release-acceptance.spec.mjs,line=1,title=V1 release diagnostic::Cross-workspace recovery/security/responsive/performance release acceptance failed"
          elif [ -f V1_PERFORMANCE_REPORT.json ]; then
            python3 - <<'PY'
          from pathlib import Path
          text=Path('V1_PERFORMANCE_REPORT.json').read_text()[:7000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::notice file=scripts/runtime-v1-release-acceptance.spec.mjs,line=1,title=V1 release acceptance::{text}')
          PY
          fi
          exit "$STATUS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-smoke
          path: |
            runtime-smoke.png
            runtime-smoke-report.json
            runtime-smoke-diagnostic.txt
            runtime-gvg-smoke.png
            runtime-gvg-smoke-report.json
            runtime-arena-smoke.png
            runtime-arena-smoke-report.json
            V1_PERFORMANCE_REPORT.json
            visual-qa/
            test-results/
          if-no-files-found: ignore
      - name: Ensure migration is deterministic
        run: |
          git checkout -- src
          npm run apply:global-v2
          cp -R src "$RUNNER_TEMP/src-first"
          git checkout -- src
          npm run apply:global-v2
          diff -ru "$RUNNER_TEMP/src-first" src
      - name: Verify Cloudflare Pages exact SHA and Arena production browser smoke
        if: github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_URL: https://wonton-wwm.pages.dev/
        run: |
          npx playwright test scripts/runtime-production-arena.spec.mjs --reporter=line --workers=1 --timeout=600000
      - name: Verify Cloudflare Pages exact SHA and V1 production browser smoke
        if: github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_URL: https://wonton-wwm.pages.dev/
        run: |
          npx playwright test scripts/runtime-production-v1.spec.mjs --reporter=line --workers=1 --timeout=600000
      - name: Publish exact production verification artifact
        if: github.event_name == 'push' && always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification
          path: |
            production-verification.json
            production-arena-smoke.png
            V1_PRODUCTION_SMOKE.json
            v1-production-mobile-smoke.png
            test-results/
          if-no-files-found: ignore
