name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify Cloudflare Pages Node baseline
        run: |
          node --version
          npm --version
      - name: Refresh production audit lock for recovery
        run: npm audit fix --package-lock-only --omit=dev
      - uses: actions/upload-artifact@v4
        with:
          name: audit-lock-recovery
          path: package-lock.json
      - name: Commit recovered audit lock
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh production audit lock"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      - name: Validate Global T96 product model
        run: npm run validate:t96-product
      - name: Validate Cloudflare Pages dist
        run: |
          npm run validate:pages-dist
          find dist -maxdepth 2 -type f | sort
      - name: Re-run production OCR parser regressions
        run: npm run validate:ocr-runtime
      - name: Install browser smoke-test runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install chromium
      - name: Smoke-test the production bundle in Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/wwm-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          set +e
          npx playwright test scripts/runtime-t96-acceptance.spec.mjs --reporter=line --workers=1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] && [ -f runtime-smoke-diagnostic.txt ]; then
            python3 - <<'PY'
          from pathlib import Path
          text=Path('runtime-smoke-diagnostic.txt').read_text()[:7000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::error file=scripts/runtime-t96-acceptance.spec.mjs,line=1,title=T96 runtime diagnostic::{text}')
          PY
          fi
          if [ "$STATUS" -eq 0 ] && [ -f runtime-smoke-report.json ]; then
            python3 - <<'PY'
          from pathlib import Path
          text=Path('runtime-smoke-report.json').read_text()[:7000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::notice file=scripts/runtime-t96-acceptance.spec.mjs,line=1,title=T96 runtime acceptance::{text}')
          PY
          fi
          exit "$STATUS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-smoke
          path: |
            runtime-smoke.png
            runtime-smoke-report.json
            runtime-smoke-diagnostic.txt
            test-results/
          if-no-files-found: ignore
      - name: Ensure migration is deterministic
        run: |
          git checkout -- src
          npm run apply:global-v2
          cp -R src "$RUNNER_TEMP/src-first"
          git checkout -- src
          npm run apply:global-v2
          diff -ru "$RUNNER_TEMP/src-first" src
