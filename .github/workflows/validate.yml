name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify Cloudflare Pages Node baseline
        run: |
          node --version
          npm --version
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      - name: Validate Cloudflare Pages dist
        run: |
          npm run validate:pages-dist
          find dist -maxdepth 2 -type f | sort
      - name: Re-run production OCR parser regressions
        run: npm run validate:ocr-runtime
      - name: Install browser smoke-test runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install chromium
      - name: Smoke-test the production bundle in Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/wwm-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          READY=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat "$RUNNER_TEMP/wwm-preview.log"
            exit 1
          fi
          npx playwright test scripts/runtime-smoke.spec.mjs --reporter=line --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-smoke
          path: |
            runtime-smoke.png
            test-results/
          if-no-files-found: ignore
      - name: Ensure migration is deterministic
        run: |
          git checkout -- src
          npm run apply:global-v2
          cp -R src "$RUNNER_TEMP/src-first"
          git checkout -- src
          npm run apply:global-v2
          diff -ru "$RUNNER_TEMP/src-first" src
