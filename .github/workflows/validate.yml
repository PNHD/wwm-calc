name: Validate

on:
  pull_request:
  push:
    branches:
      - update/global-v2-t96

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Ensure migration is idempotent
        run: |
          npm run apply:global-v2
          git diff --exit-code
