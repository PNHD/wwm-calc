name: Verify and deploy Wonton Reforge Lab

on:
  push:
    branches:
      - feature/wonton-tracker
    paths:
      - "wonton-tracker/**"
      - ".github/workflows/wonton-tracker-pages.yml"
  pull_request:
    branches:
      - feature/wonton-tracker
    paths:
      - "wonton-tracker/**"
      - ".github/workflows/wonton-tracker-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    name: Verify Lab; deploy production branch only when credentials are configured
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify standalone files and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          test -s wonton-tracker/index.html
          test -s wonton-tracker/app.js
          test -s wonton-tracker/simulator/index.html
          grep -q '<title>Wonton Reforge Lab v2</title>' wonton-tracker/index.html
          grep -q '?mode=practice' wonton-tracker/simulator/index.html
          ! grep -q 'Math.random' wonton-tracker/core/live.js
          find wonton-tracker/core wonton-tracker/data wonton-tracker/tests -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check wonton-tracker/app.js

      - name: Run Live tests
        run: node --test wonton-tracker/tests/live.test.js

      - name: Run Practice tests
        run: node --test wonton-tracker/tests/practice.test.js

      - name: Run migration, import, plan, and pricing tests
        run: node --test wonton-tracker/tests/storage.test.js wonton-tracker/tests/shared.test.js

      - name: Install Wrangler
        if: ${{ github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npm install --global wrangler@4

      - name: Ensure Pages project exists
        if: ${{ github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! wrangler pages project list --json | jq -e '.[] | select(.name == "wonton-tracker")' >/dev/null; then
            wrangler pages project create wonton-tracker --production-branch=main
          fi

      - name: Deploy production
        if: ${{ github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: wrangler pages deploy wonton-tracker --project-name=wonton-tracker --branch=main
