name: Deploy Wonton Tracker to Cloudflare Pages

on:
  push:
    branches:
      - feature/wonton-tracker
    paths:
      - "wonton-tracker/**"
      - ".github/workflows/wonton-tracker-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    name: Verify tracker; deploy when Cloudflare credentials are configured
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify standalone site
        shell: bash
        run: |
          set -euo pipefail
          test -s wonton-tracker/index.html
          grep -q '<title>Wonton Tracker · Silent Voice Reforge</title>' wonton-tracker/index.html
          grep -q 'Gold pity' wonton-tracker/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("wonton-tracker/index.html").read_text()
          blocks = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert len(blocks) == 1, f"expected one inline script, got {len(blocks)}"
          Path("/tmp/wonton-tracker.js").write_text(blocks[0])
          PY
          node --check /tmp/wonton-tracker.js

      - name: Install Wrangler
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npm install --global wrangler@4

      - name: Ensure Pages project exists
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! wrangler pages project list --json | jq -e '.[] | select(.name == "wonton-tracker")' >/dev/null; then
            wrangler pages project create wonton-tracker --production-branch=main
          fi

      - name: Deploy production
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          wrangler pages deploy wonton-tracker --project-name=wonton-tracker --branch=main
